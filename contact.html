<script>
/* Assemble the address at runtime so it never appears in the page source. */
(function () {
  var p = ['ai', 'ts', 'ce.', 'bru', 'dr.'].reverse().join('');
  var q = ['liamg', 'moc'].map(function (s) { return s.split('').reverse().join(''); }).join('.');
  var addr = p + String.fromCharCode(64) + q;
  var el = document.getElementById('em');
  el.href = 'ma' + 'il' + 'to:' + addr;
  el.textContent = addr;
})();
</script>
